name: Preschool emulator QA
on:
  workflow_dispatch:
  push:
    branches: [qa/preschool-emulator]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            size: 1080x1920
            density: 420
          - device: tablet
            size: 1200x1920
            density: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1'
      - name: Debug signer
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname CN=AndroidDebug
      - name: Download and verify Gradle
        run: |
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip -o "$RUNNER_TEMP/gradle-9.3.1-bin.zip"
          echo "b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06  $RUNNER_TEMP/gradle-9.3.1-bin.zip" | sha256sum --check
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\:$RUNNER_TEMP/gradle-9.3.1-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - name: Build app and instrumented tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run preschool journeys on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            adb logcat -c
            bash scripts/run-kid-emulator-qa.sh
      - name: Retain evidence even when assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kid-qa-${{ matrix.device }}
          path: |
            kid-qa-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/tests/
          retention-days: 14
