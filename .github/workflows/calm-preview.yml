name: Calm play preview
on:
  push:
    branches: [feature/calm-toddler-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare preview signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Wonder Preview,O=Android,C=US" -keyalg RSA -validity 10000
      - name: Compile and run regression tests
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest -PcalmPreview=true --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonder-calm-preview
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/tests/
            app/build/test-results/
