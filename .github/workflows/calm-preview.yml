name: Calm play preview
on:
  push:
    branches: [feature/calm-toddler-ui]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Verify catalog and media preservation
        run: bash scripts/verify-calm-preservation.sh
      - name: Prepare preview signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Wonder Preview,O=Android,C=US" -keyalg RSA -validity 10000
      - name: Compile and run regression tests
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest -PcalmPreview=true --no-configuration-cache --no-daemon 2>&1 | tee build-log.txt; then
            if grep -Eq '429|Read timed out|Connection reset' build-log.txt; then
              sleep 20
              gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest -PcalmPreview=true --no-configuration-cache --no-daemon
            else
              exit 1
            fi
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise calm play on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/validate-calm-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonder-calm-preview
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            calm-evidence.tar
