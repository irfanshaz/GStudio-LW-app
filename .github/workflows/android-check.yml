name: Android check
on:
  push:
    branches: [fix/offline-media-and-gameplay]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify offline media index
        run: |
          python3 scripts/index_media.py
          git diff --exit-code -- app/src/main/assets/real-world-index.json
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1'
      - name: Set up test signer
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname CN=AndroidDebug
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify offline media in the APK
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          index = json.loads(Path("app/src/main/assets/real-world-index.json").read_text())
          (apk,) = Path("app/build/outputs/apk/debug").glob("*.apk")
          with ZipFile(apk) as package:
              for path, media in index["files"].items():
                  digest = hashlib.sha256(package.read(f"assets/real-world/{path}")).hexdigest()
                  if digest != media["sha256"]:
                      raise SystemExit(f"APK media checksum mismatch: {path}")
          print(f"Verified {len(index['files'])} offline media files in {apk.name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: little-wonder-world-debug
          path: app/build/outputs/apk/debug/*.apk
