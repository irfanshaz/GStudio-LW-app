name: Garden and child interaction validation
on:
  push:
    branches: [fix/toddler-tracing-media]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36.1 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare debug key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
          fi
      - run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest -PgardenPreview=true --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Simulate child interactions on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: com.aistudio.littlewonderworld.wvkqzp.garden
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/validate-child-interactions.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: child-interaction-validation
          path: |
            child-interaction-evidence/
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/
