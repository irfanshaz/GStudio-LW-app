name: Child interaction validation
on:
  push:
    branches: [fix/child-interaction-quality]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare debug key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 10000
          fi
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: child-interaction-validation
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/apk/debug/
